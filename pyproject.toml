[project]
name = "code-inference-query"
version = "0.1.0"
description = "MCP server for querying code inference corpus by shorthand citation or natural language"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["mcp>=1.0,<2.0"]

[project.optional-dependencies]
dev = ["build==1.5.0", "pytest==8.4.2"]
vector = ["lancedb>=0.3,<1.0", "fastembed>=0.2,<0.4"]

[project.scripts]
code-inference-query = "code_inference_query.server:main"

[build-system]
requires = ["hatchling>=1.0,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/code_inference_query"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
ignore_missing_imports = true
show_error_codes = true
